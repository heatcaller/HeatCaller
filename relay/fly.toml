# fly.toml app configuration file for the HeatCaller relay. An app it moved
# from stays up as a forwarder - see README, "Moving to a new app name".
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'heatcaller-relay'
primary_region = 'ewr'

[build]
[env]
  RELAY_DATA = '/data'

[[mounts]]
  source = 'relay_data'
  destination = '/data'

[http_service]
  internal_port = 8787
  force_https = true
  # WHY (27 Nov 2026, Asher: "when loading the web app on phone it usually
  # loads a white screen. I have to switch screens or force close"): 'stop'
  # shut the machine down a few minutes after the last request, so most
  # times a phone opened the app the relay was off and took about 6 seconds
  # to boot (stopped 14:11 to 17:59 that day, answering at 17:59:46 for a
  # wake at 17:59:40). The home-screen app sat white meanwhile, and by the
  # time the driver switched away and back it was up. 'suspend' freezes the
  # machine instead and wakes it in well under a second, at the same cost.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
