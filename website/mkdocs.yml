site_name: HeatCaller Documentation
site_description: Run RC race nights from one laptop - timing, race control, an AI announcer, results, championships and online check-in.
site_url: https://heatcaller.com/docs/
docs_dir: docs
# WHY (25 Nov 2026, Asher: "take it down"): the release notes describe how the
# patent-pending announcer features work, so they stay in the repo but are never
# published, until the patent applications are filed.
exclude_docs: |
  release-notes.md
copyright: >-
  &copy; 2026 HeatCaller LLC. LiveTime, LiveRC, MYLAPS, AMB, RC4, EasyLap, Robitronic,
  I-Lap and other product names are trademarks of their owners, used here only to say
  what HeatCaller works with. HeatCaller is not affiliated with or endorsed by them.

theme:
  name: material
  # WHY (25 Nov 2026): the PC's own fonts, not Google Fonts - nothing loaded from another site, and quicker on a slow track connection.
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys
  - attr_list
  - tables
  - toc:
      permalink: true

